services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./offpage_seo.db}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-*}
    volumes:
      - ./data:/app/data
      - search-cache:/app/search_cache.db
    restart: unless-stopped
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      - backend
  # Postgres option: uncomment for multi-brand parallel + scheduled re-runs at scale
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: offpage
  #     POSTGRES_USER: offpage
  #     POSTGRES_PASSWORD: offpage
  #   ports:
  #     - "5432:5432"
volumes:
  search-cache:
